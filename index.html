<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Rhythm Tiles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="bg-pattern"></div>

  <!-- Combo Milestone Banner -->
  <div class="combo-banner" id="comboBanner"></div>

  <!-- Start Screen -->
  <div class="overlay-screen active" id="startScreen">
    <h1 class="screen-title">Rhythm Tiles</h1>
    <p class="screen-subtitle">Tap the falling notes in time</p>

    <div class="highscore-display">
      Best Score: <span id="highscoreValue">—</span>
    </div>

    <div class="difficulty-selector">
      <button class="diff-btn easy" data-diff="easy">Easy</button>
      <button class="diff-btn medium active" data-diff="normal">Normal</button>
      <button class="diff-btn hard" data-diff="hard">Hard</button>
    </div>

    <button class="game-btn" id="startBtn">Play</button>

    <div class="instructions-box">
      <p>Press <kbd>D</kbd> <kbd>F</kbd> <kbd>J</kbd> <kbd>K</kbd> or tap the lanes when notes reach the line. Don't
        miss any notes!</p>
    </div>
  </div>

  <!-- Pause Screen -->
  <div class="overlay-screen" id="pauseScreen">
    <h1 class="screen-title">Paused</h1>
    <p class="screen-subtitle">Take a breath ☕</p>
    <button class="game-btn" id="resumeBtn">Resume</button>
    <button class="game-btn secondary" id="quitBtn">Quit to Menu</button>
  </div>

  <!-- Game Over Screen -->
  <div class="overlay-screen" id="gameOverScreen">
    <div class="accuracy-badge s-rank" id="accuracyBadge">S</div>
    <div class="new-best-badge" id="newBestBadge">✨ New Best!</div>
    <h1 class="screen-title" style="color: var(--danger);">Game Over</h1>
    <div class="final-stats">
      <div>
        <div class="final-stat-value" id="finalScore">0</div>
        <div class="final-stat-label">Score</div>
      </div>
      <div>
        <div class="final-stat-value" id="finalCombo">0</div>
        <div class="final-stat-label">Max Combo</div>
      </div>
      <div>
        <div class="final-stat-value" id="finalNotes">0</div>
        <div class="final-stat-label">Notes Hit</div>
      </div>
    </div>
    <button class="game-btn" id="restartBtn">Try Again</button>
    <button class="game-btn secondary" id="menuBtn">Menu</button>
  </div>

  <!-- Game Wrapper -->
  <div class="game-wrapper">
    <header class="game-header">
      <div class="lives-container" id="livesContainer"></div>

      <div class="header-center">
        <button class="pause-btn" id="pauseBtn" aria-label="Pause">⏸</button>
        <button class="mute-btn" id="muteBtn" aria-label="Mute">🔊</button>
      </div>

      <div class="header-stats">
        <div class="stat-box">
          <div class="stat-label">Combo</div>
          <div class="stat-value mono" id="comboDisplay">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Score</div>
          <div class="stat-value score mono" id="scoreDisplay">0</div>
        </div>
      </div>
    </header>

    <div class="game-area" id="gameArea">
      <canvas id="gameCanvas"></canvas>

      <!-- Lane flash overlays -->
      <div class="lane-flash" id="laneFlash0" style="left:0%;   width:25%; background: var(--lane-1);"></div>
      <div class="lane-flash" id="laneFlash1" style="left:25%;  width:25%; background: var(--lane-2);"></div>
      <div class="lane-flash" id="laneFlash2" style="left:50%;  width:25%; background: var(--lane-3);"></div>
      <div class="lane-flash" id="laneFlash3" style="left:75%;  width:25%; background: var(--lane-4);"></div>

      <!-- Invincibility overlay -->
      <div class="invincible-overlay" id="invincibleOverlay"></div>

      <div class="hit-line"></div>
      <div class="speed-indicator">Speed: <span id="speedDisplay">3.0</span>x</div>
    </div>

    <div class="touch-controls" id="touchControls">
      <div class="touch-lane" data-lane="0"><span class="key-hint">D</span></div>
      <div class="touch-lane" data-lane="1"><span class="key-hint">F</span></div>
      <div class="touch-lane" data-lane="2"><span class="key-hint">J</span></div>
      <div class="touch-lane" data-lane="3"><span class="key-hint">K</span></div>
    </div>
  </div>

  <script src="game.js"></script>
  <script>
    // Quit / menu buttons
    document.getElementById('quitBtn').addEventListener('click', () => {
      state.playing = false;
      state.paused = false;
      audio.stopBackgroundBeat();
      document.getElementById('pauseScreen').classList.remove('active');
      document.getElementById('startScreen').classList.add('active');
      document.getElementById('pauseBtn').style.display = 'none';
      updateStartScreenStats();
    });
    document.getElementById('menuBtn').addEventListener('click', () => {
      document.getElementById('gameOverScreen').classList.remove('active');
      document.getElementById('startScreen').classList.add('active');
      updateStartScreenStats();
    });
  </script>
</body>

</html>
